global:
  scrape_interval: 20s
  scrape_timeout:  10s
scrape_configs:
  - job_name: 'some_job'
    static_configs:
      - ['not_a_map']

remote_write:
  - url: 'http://performance-manager:8428/api/v1/write'

rule_files:
  - /etc/prometheus/alert.rules

alerting:
  alertmanagers:
    - static_configs:
      - targets:
        - alertmanager:9093
