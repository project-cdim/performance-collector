global:
  scrape_interval: 20s
  scrape_timeout:  10s
scrape_configs:
  - job_name: '0001'
    static_configs:
      - targets: 
         - 123
    metrics_path: '/cdim/api/v1/performance-exporter/devices/0001/metrics'

remote_write:
  - url: 'http://performance-manager:8428/api/v1/write'

rule_files:
  - /etc/prometheus/alert.rules

alerting:
  alertmanagers:
    - static_configs:
      - targets:
        - alertmanager:9093
